stages:
  - build
  - merge

build:
  stage: build
  image: cimg/android:2025.03.1
  before_script:
    - yes | sdkmanager --licenses
    - sdkmanager "platform-tools" "build-tools;30.0.3" "platforms;android-30"
  script:
    - ./gradlew build
  artifacts:
    paths:
      - app/build/outputs/apk
    expire_in: 1 day

merge:
  stage: merge
  image: curlimages/curl:latest
  script:
    - |
      curl --request POST --header "PRIVATE-TOKEN: $DULNO_GITLAB_PRIVATE_TOKEN" \
      --data "source_branch=dev&target_branch=main&title=Production deployment" \
      --data "remove_source_branch=false&squash=true" \
      "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/merge_requests"
  only:
    - dev
  when: on_success